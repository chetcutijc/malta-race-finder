name: Refresh races

on:
  schedule:
    # Every Monday at 06:00 UTC (07:00 Malta time in winter, 08:00 in summer).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write   # needed to commit races-auto.json back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest races
        run: python scripts/refresh_races.py

      - name: Commit races-auto.json if it changed
        run: |
          git config user.name "malta-race-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add races-auto.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh races"
            git push
          fi
